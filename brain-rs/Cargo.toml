[package]
name = "shadow-warrior-brain"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Web server
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
tower = "0.4"

# BLE communication
btleplug = "0.11"
earshot = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Audio capture & playback
cpal = "0.17.3"
rodio = "0.22.1"

# LED effects (removed smart_led_effects - will implement effects manually)
palette = "0.7"
rgb = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Configuration
figment = { version = "0.10", features = ["yaml", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Utilities
uuid = "1"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
dashmap = "6"
rand = "0.8"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Device Discovery
ssdp-client = "2.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }

[dev-dependencies]
tokio-test = "0.4"
