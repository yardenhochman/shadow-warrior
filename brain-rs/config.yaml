server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

arena:
  # Timing configuration
  warming_energy_threshold: 100.0  # Energy points to trigger FIGHT
  fight_duration_sec: 180          # 3 minutes default
  fight_inactivity_timeout_sec: 30 # End fight if no activity
  cooldown_duration_sec: 60

  # Energy bar settings
  shout_energy_multiplier: 10.0
  energy_decay_rate: 0.5           # Points per second

ble:
  auto_connect: true
  scan_timeout_sec: 5
  retry_interval_sec: 10
  device_name_patterns:
    - "shadow"
    - "warrior"
    - "punch"
    - "bag"

  # Punching bag parameters
  alpha: 0.8
  threshold: 2.0

audio:
  sample_rate: 16000
  channels: 1
  buffer_size: 1024
  # (legacy shout_threshold_db was removed; old files that still have it load fine, key is ignored)
  vad_threshold: 0.5         # earshot VAD prob; used only as an activation gate

  # Shout detection (services/shout_detector.rs). Pipeline: band-pass -> adaptive
  # noise floor -> VAD gate w/ hangover -> shout features -> score -> ShoutDetected.
  # All keys optional (defaults shown). Target latency < 300ms from onset.
  shout_margin_db: 15.0            # required dB above the adaptive noise floor
  shout_playback_margin_db: 8.0    # extra margin while our speakers play (Fight)
  vad_hangover_frames: 6           # keep VAD gate open N frames (16ms) after speech
  shout_f0_min_hz: 150.0           # voiced pitch range of a shout
  shout_f0_max_hz: 700.0
  shout_pitch_conf_min: 0.4        # autocorr confidence to count as voiced
  shout_centroid_min_hz: 900.0     # spectral centroid (shouts are bright)
  shout_tilt_min_db_per_khz: -25.0 # spectral tilt floor
  shout_flatness_max: 0.5          # reject noise-like frames (wind, crowd)
  shout_min_features: 3            # of 4 checks (voiced/centroid/tilt/flatness) required
  shout_min_duration_sec: 0.2      # sustained shouty time before firing (keep < 0.3)
  shout_gap_frames: 3              # non-shouty frames tolerated inside a shout
  shout_sensitivity: 1.0           # score gain per shouty frame
  shout_score_threshold: 8.0       # score at which ShoutDetected fires
  shout_score_decay: 0.9           # per-frame score decay when not shouty

  # Audio clip recording (wav + per-frame feature json), for tuning detectors.
  # Clips can be requested via POST /api/audio/clip and are auto-recorded on shouts.
  clip_dir: "./clips"        # output directory (created on demand)
  clip_seconds: 5.0          # length of each clip (capped by the front-end ring buffer)
  clip_on_shout: true        # record a clip whenever a shout is detected
  clip_cooldown_sec: 10.0    # min seconds between automatic shout clips

music:
  playlist_dir: "./music"
  formats:
    - "mp3"
    - "flac"
    - "wav"
  shuffle: true
  volume: 0.8

wled:
  controllers: []

  udp_fps: 30
  # effect/palette: device effect name (see GET /api/wled/effects), numeric id, or "realtime".
  # Optional per effect: speed, intensity, brightness (0-255), transition (100ms units),
  # colors (up to 3 RGB triples, e.g. [[255,0,0],[0,0,255]]).
  effects:
    idle:
      effect: "breathe"
      palette: "ocean"
      speed: 128
    warming:
      effect: "rainbow"
      palette: "rainbow"
      speed: 200
    fight:
      effect: "realtime"  # UDP realtime
    cooldown:
      effect: "fire"
      palette: "lava"
      speed: 150

# Tasmota smart plugs (HTTP). Each plug lists the arena states during which it
# is ON (suspended, idle, warming, fight, cooldown); it is switched OFF in all
# other states. A plug with no on_states is only switched off on IDLE/SUSPENDED.
# Unreachable plugs are retried once and never block the state machine.
tasmota:
  plugs: []
  # - name: uv_lights
  #   ip: 192.168.1.50
  #   on_states: [warming, fight]

# Daily schedule. When enabled, the game is only active inside these windows
# (local time, "HH:MM"). Outside them the arena is SUSPENDED and presence is
# ignored. "days" is optional (mon..sun); omitted = every day. A window whose
# end <= start wraps past midnight.
schedule:
  enabled: false
  windows: []
  # - days: [fri, sat]
  #   start: "18:00"
  #   end: "02:00"

# Fused presence detection (services/presence.rs). Sources (mic, punches, later
# radar/motion) report weighted evidence; a leaky accumulator must reach
# enter_threshold to publish PresenceDetected{true}, and PresenceDetected{false}
# fires after leave_timeout_sec without evidence. Events only on state changes.
# Mic evidence = near-field voiced frames (VAD + margin over the adaptive floor),
# so distant party noise never accumulates. All keys optional (defaults shown).
presence:
  enabled: true
  mic_margin_db: 10.0           # dB above noise floor for a frame to count
  mic_playback_margin_db: 8.0   # extra margin while our speakers play
  mic_vad_threshold: 0.5
  punch_units: 1.0              # evidence-seconds per punch (1.0 = one punch enters)
  source_weights: {mic: 1.0, punch: 1.0}  # add e.g. radar: 2.0 for new sensors
  default_weight: 1.0           # weight for sources not listed above
  enter_threshold: 1.0          # evidence-seconds to enter (~1.3s of steady speech)
  decay_per_sec: 0.2          # accumulator leak; rejects sporadic bursts
  max_score: 2.0
  leave_timeout_sec: 60.0       # no evidence this long -> not present
