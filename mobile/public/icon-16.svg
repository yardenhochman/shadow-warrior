<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fistGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="16" height="16" rx="3" fill="url(#bgGradient)"/>
  
  <!-- Fist/Glove -->
  <g transform="translate(8, 8)">
    <!-- Main fist body -->
    <ellipse cx="0" cy="0" rx="3" ry="4" fill="url(#fistGradient)"/>
    
    <!-- Fist details -->
    <ellipse cx="-1" cy="-1" rx="1" ry="1.5" fill="#e55a2b"/>
    <ellipse cx="1" cy="-1" rx="1" ry="1.5" fill="#e55a2b"/>
    <ellipse cx="0" cy="0.5" rx="1.2" ry="1.5" fill="#e55a2b"/>
    
    <!-- Knuckles -->
    <circle cx="-0.5" cy="-1.2" r="0.4" fill="#d44a1a"/>
    <circle cx="0.5" cy="-1.2" r="0.4" fill="#d44a1a"/>
    <circle cx="-0.2" cy="-0.5" r="0.4" fill="#d44a1a"/>
    <circle cx="0.2" cy="-0.5" r="0.4" fill="#d44a1a"/>
    
    <!-- Wrist band -->
    <rect x="-1.5" y="2.5" width="3" height="0.8" rx="0.4" fill="#8b4513"/>
  </g>
</svg>
