<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fistGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGradient)"/>
  
  <!-- Shadow effect -->
  <ellipse cx="256" cy="400" rx="200" ry="60" fill="#000000" opacity="0.3"/>
  
  <!-- Fist/Glove -->
  <g transform="translate(256, 256)">
    <!-- Main fist body -->
    <ellipse cx="0" cy="0" rx="80" ry="100" fill="url(#fistGradient)" filter="url(#glow)"/>
    
    <!-- Fist details -->
    <ellipse cx="-20" cy="-20" rx="25" ry="35" fill="#e55a2b"/>
    <ellipse cx="20" cy="-20" rx="25" ry="35" fill="#e55a2b"/>
    <ellipse cx="0" cy="10" rx="30" ry="40" fill="#e55a2b"/>
    
    <!-- Knuckles -->
    <circle cx="-15" cy="-30" r="8" fill="#d44a1a"/>
    <circle cx="15" cy="-30" r="8" fill="#d44a1a"/>
    <circle cx="-5" cy="-10" r="8" fill="#d44a1a"/>
    <circle cx="5" cy="-10" r="8" fill="#d44a1a"/>
    
    <!-- Wrist band -->
    <rect x="-40" y="60" width="80" height="20" rx="10" fill="#8b4513"/>
    <rect x="-35" y="65" width="70" height="10" rx="5" fill="#a0522d"/>
  </g>
  
  <!-- Energy waves -->
  <g opacity="0.6">
    <circle cx="256" cy="256" r="120" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.4"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Title text -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">SHADOW WARRIOR</text>
</svg>
