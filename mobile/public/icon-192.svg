<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fistGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="32" fill="url(#bgGradient)"/>
  
  <!-- Shadow effect -->
  <ellipse cx="96" cy="160" rx="80" ry="20" fill="#000000" opacity="0.2"/>
  
  <!-- Fist/Glove -->
  <g transform="translate(96, 96)">
    <!-- Main fist body -->
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="url(#fistGradient)" filter="url(#glow)"/>
    
    <!-- Fist details -->
    <ellipse cx="-12" cy="-12" rx="12" ry="16" fill="#e55a2b"/>
    <ellipse cx="12" cy="-12" rx="12" ry="16" fill="#e55a2b"/>
    <ellipse cx="0" cy="5" rx="15" ry="20" fill="#e55a2b"/>
    
    <!-- Knuckles -->
    <circle cx="-10" cy="-18" r="4" fill="#d44a1a"/>
    <circle cx="10" cy="-18" r="4" fill="#d44a1a"/>
    <circle cx="-3" cy="-6" r="4" fill="#d44a1a"/>
    <circle cx="3" cy="-6" r="4" fill="#d44a1a"/>
    
    <!-- Wrist band -->
    <rect x="-18" y="28" width="36" height="8" rx="4" fill="#8b4513"/>
    <rect x="-15" y="30" width="30" height="4" rx="2" fill="#a0522d"/>
  </g>
  
  <!-- Energy waves -->
  <g opacity="0.5">
    <circle cx="96" cy="96" r="60" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.4"/>
    <circle cx="96" cy="96" r="80" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
