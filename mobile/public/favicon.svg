<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fistGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bgGradient)"/>
  
  <!-- Fist/Glove -->
  <g transform="translate(16, 16)">
    <!-- Main fist body -->
    <ellipse cx="0" cy="0" rx="6" ry="8" fill="url(#fistGradient)"/>
    
    <!-- Fist details -->
    <ellipse cx="-2" cy="-2" rx="2" ry="3" fill="#e55a2b"/>
    <ellipse cx="2" cy="-2" rx="2" ry="3" fill="#e55a2b"/>
    <ellipse cx="0" cy="1" rx="2.5" ry="3" fill="#e55a2b"/>
    
    <!-- Knuckles -->
    <circle cx="-1" cy="-2.5" r="0.8" fill="#d44a1a"/>
    <circle cx="1" cy="-2.5" r="0.8" fill="#d44a1a"/>
    <circle cx="-0.5" cy="-1" r="0.8" fill="#d44a1a"/>
    <circle cx="0.5" cy="-1" r="0.8" fill="#d44a1a"/>
    
    <!-- Wrist band -->
    <rect x="-3" y="5" width="6" height="1.5" rx="0.8" fill="#8b4513"/>
  </g>
</svg>
