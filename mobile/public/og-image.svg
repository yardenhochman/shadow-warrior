<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fistGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Background pattern -->
  <g opacity="0.1">
    <circle cx="200" cy="150" r="100" fill="#ff6b35"/>
    <circle cx="1000" cy="480" r="80" fill="#f7931e"/>
    <circle cx="300" cy="500" r="60" fill="#ff6b35"/>
    <circle cx="900" cy="200" r="70" fill="#f7931e"/>
  </g>
  
  <!-- Main fist/glove -->
  <g transform="translate(300, 315)" filter="url(#shadow)">
    <!-- Main fist body -->
    <ellipse cx="0" cy="0" rx="120" ry="150" fill="url(#fistGradient)" filter="url(#glow)"/>
    
    <!-- Fist details -->
    <ellipse cx="-30" cy="-30" rx="40" ry="50" fill="#e55a2b"/>
    <ellipse cx="30" cy="-30" rx="40" ry="50" fill="#e55a2b"/>
    <ellipse cx="0" cy="15" rx="45" ry="60" fill="#e55a2b"/>
    
    <!-- Knuckles -->
    <circle cx="-25" cy="-45" r="12" fill="#d44a1a"/>
    <circle cx="25" cy="-45" r="12" fill="#d44a1a"/>
    <circle cx="-8" cy="-15" r="12" fill="#d44a1a"/>
    <circle cx="8" cy="-15" r="12" fill="#d44a1a"/>
    
    <!-- Wrist band -->
    <rect x="-60" y="90" width="120" height="30" rx="15" fill="#8b4513"/>
    <rect x="-50" y="100" width="100" height="10" rx="5" fill="#a0522d"/>
  </g>
  
  <!-- Energy waves -->
  <g opacity="0.4">
    <circle cx="300" cy="315" r="180" fill="none" stroke="#ff6b35" stroke-width="4"/>
    <circle cx="300" cy="315" r="240" fill="none" stroke="#ff6b35" stroke-width="3"/>
    <circle cx="300" cy="315" r="300" fill="none" stroke="#ff6b35" stroke-width="2"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" filter="url(#shadow)">SHADOW WARRIOR</text>
  
  <!-- Subtitle -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#cccccc" filter="url(#shadow)">Interactive Punching Bag Training</text>
  
  <!-- Features -->
  <g transform="translate(600, 400)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#ff6b35">🥊 Track Performance</text>
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#ff6b35">📊 Real-time Analytics</text>
    <text x="0" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#ff6b35">🎵 Dynamic Music</text>
  </g>
</svg>
