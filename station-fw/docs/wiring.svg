<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="ui-monospace, Menlo, monospace"><style>:root{--bg:#fff}</style><rect width="1000" height="760" fill="#ffffff"/><text x="30" y="34" font-size="18" text-anchor="start" fill="#1f2937" font-weight="bold">Sensor station perfboard (5 x 7 cm): wiring</text><text x="30" y="54" font-size="12" text-anchor="start" fill="#6b7280">Nets and parts: HARDWARE.md. All GND symbols meet at ONE star pad; the radar GND has its own wire to it.</text><rect x="440" y="70" width="200" height="530" rx="3" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.6"/><text x="540.0" y="100" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">ESP32-WROOM devkit</text><text x="540.0" y="118" font-size="11" text-anchor="middle" fill="#6b7280">38-pin, USB at the bottom</text><line x1="428" y1="140" x2="440" y2="140" stroke="#1f2937" stroke-width="1.6"/><text x="448" y="144" font-size="11" text-anchor="start" fill="#1f2937">3V3</text><line x1="428" y1="230" x2="440" y2="230" stroke="#1f2937" stroke-width="1.6"/><text x="448" y="234" font-size="11" text-anchor="start" fill="#1f2937">GPIO33</text><line x1="428" y1="270" x2="440" y2="270" stroke="#1f2937" stroke-width="1.6"/><text x="448" y="274" font-size="11" text-anchor="start" fill="#1f2937">GPIO25</text><line x1="428" y1="310" x2="440" y2="310" stroke="#1f2937" stroke-width="1.6"/><text x="448" y="314" font-size="11" text-anchor="start" fill="#1f2937">GPIO26</text><line x1="428" y1="350" x2="440" y2="350" stroke="#1f2937" stroke-width="1.6"/><text x="448" y="354" font-size="11" text-anchor="start" fill="#1f2937">GPIO27</text><line x1="428" y1="530" x2="440" y2="530" stroke="#1f2937" stroke-width="1.6"/><text x="448" y="534" font-size="11" text-anchor="start" fill="#1f2937">GND</text><line x1="428" y1="570" x2="440" y2="570" stroke="#1f2937" stroke-width="1.6"/><text x="448" y="574" font-size="11" text-anchor="start" fill="#1f2937">5V</text><text x="448" y="372" font-size="10" text-anchor="start" fill="#6b7280">optional: radar OUT (unused)</text><rect x="20" y="158" width="64" height="138" rx="3" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.6"/><text x="52" y="152" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">J_MIC_A</text><text x="26" y="174" font-size="10" text-anchor="start" fill="#1f2937">1 VMIC</text><line x1="84" y1="170" x2="140" y2="170" stroke="#dc2626" stroke-width="1.6"/><circle cx="140" cy="170" r="3.4" fill="#dc2626"/><text x="26" y="196" font-size="10" text-anchor="start" fill="#1f2937">2 GND</text><line x1="84" y1="192" x2="110" y2="192" stroke="#6b7280" stroke-width="1.6"/><circle cx="110" cy="192" r="3.4" fill="#6b7280"/><text x="26" y="218" font-size="10" text-anchor="start" fill="#1f2937">3 BCLK</text><line x1="84" y1="214" x2="170" y2="214" stroke="#2563eb" stroke-width="1.6"/><circle cx="170" cy="214" r="3.4" fill="#2563eb"/><text x="26" y="240" font-size="10" text-anchor="start" fill="#1f2937">4 LRCL</text><line x1="84" y1="236" x2="200" y2="236" stroke="#2563eb" stroke-width="1.6"/><circle cx="200" cy="236" r="3.4" fill="#2563eb"/><text x="26" y="262" font-size="10" text-anchor="start" fill="#1f2937">5 DOUT</text><line x1="84" y1="258" x2="230" y2="258" stroke="#2563eb" stroke-width="1.6"/><circle cx="230" cy="258" r="3.4" fill="#2563eb"/><text x="26" y="284" font-size="10" text-anchor="start" fill="#1f2937">6 GND</text><line x1="84" y1="280" x2="110" y2="280" stroke="#6b7280" stroke-width="1.6"/><circle cx="110" cy="280" r="3.4" fill="#6b7280"/><rect x="20" y="368" width="64" height="138" rx="3" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.6"/><text x="52" y="362" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">J_MIC_B</text><text x="26" y="384" font-size="10" text-anchor="start" fill="#1f2937">1 VMIC</text><line x1="84" y1="380" x2="140" y2="380" stroke="#dc2626" stroke-width="1.6"/><circle cx="140" cy="380" r="3.4" fill="#